model_name: null
encryption_key: null
results_dir: ''
wandb:
  enable: true
  project: TAO-training
  entity: prajwalkion-kion
  group: ''
  tags:
  - training
  - tao-toolkit
  reinit: false
  sync_tensorboard: false
  save_code: false
  name: TAO Toolkit training experiment
  run_id: ''
model:
  pretrained_backbone_path: null 
  backbone: resnet_50 
  train_backbone: true
  load_teacher_enc_dec: false 
  num_queries: 300  # Number of candidate object predictions.
  num_select: 300 # Number of predictions selected for the final output.
  num_feature_levels: 3 # Number of feature levels to use.
  return_interm_indices: # The indices of the intermediate layers to return.
  - 1 # Return the first intermediate layer.
  - 2 # Return the second intermediate layer.
  - 3 # Return the third intermediate layer.
  feat_strides: # Strides of the feature levels.
  - 8 # Stride of the first feature level.
  - 16 # Stride of the second feature level.
  - 32 # Stride of the third feature level.
  feat_channels: # Number of channels in each feature level.
  - 256 # Number of channels in the first feature level.
  - 256 # Number of channels in the second feature level.
  - 256 # Number of channels in the third feature level.
  use_encoder_idx: # Indices of the feature levels to use.
  - 2
  hidden_dim: 256  # The hidden dimension of the model.
  nheads: 8  # The attention mechanism has 8 attention heads.
  dropout_ratio: 0.0 # Dropout ratio.
  enc_layers: 1 # Number of encoder layers.
  dim_feedforward: 1024 # Dimension of the feedforward network.
  pe_temperature: 10000  # Temperature for the sinusoidal positional encoding.
  expansion: 1.0 # Expansion factor for the feedforward network.
  depth_mult: 1 # Depth multiplier for the encoder.
  enc_act: gelu # Encoder activation function.
  act: silu # Decoder activation function.
  dec_layers: 6 # Number of decoder layers.
  dn_number: 100 # Number of denoising training queries.
  eval_idx: -1 # Index of the evaluation results to use.
  vfl_loss_coef: 1.0 # Weight for the focal loss.
  bbox_loss_coef: 5.0 # Weight for the box loss.
  giou_loss_coef: 2.0 # Weight for the GIoU loss. (GIoU is a metric to evaluate the overlap between the predicted and the ground-truth boxes.)
  class_cost: 2.0 # Cost for the class prediction.
  bbox_cost: 5.0 # Cost for the box prediction.
  giou_cost: 2.0 # Cost for the GIoU prediction.
  alpha: 0.75 # Alpha parameter for the focal loss. (It controls the weight of the "easy" examples.)
  gamma: 2.0 # Gamma parameter for the focal loss. (It controls the weight of the "hard" examples.)
  clip_max_norm: 0.1 # Clip the gradients to this value.
  aux_loss: true # Use auxiliary losses.
  loss_types: # Types of losses to use.
  - vfl # Variational Focal Loss (VFL)
  - boxes # Box loss
  backbone_names: # Names of the backbone layers to use.
  - backbone.0
  linear_proj_names: # Names of the linear projection layers to use.
  - reference_points
  - sampling_offsets
  distillation_loss_coef: 1.0 # Coefficient for the distillation loss.
  frozen_fm:   # Your model configuration supports foundation-model semantic distillation, but you have not enabled it yet.
    enabled: false # Enable foundation-model semantic distillation.
    backbone: radio_v2-l
    checkpoint: null
dataset:
  train_data_sources:
    - image_dir: /workspace/new_scenerio_dataset_rtdetr/train/images
      json_file: /workspace/new_scenerio_dataset_rtdetr/annotations/instances_train.json
  val_data_sources:
      image_dir: /workspace/new_scenerio_dataset_rtdetr/val/images
      json_file: /workspace/new_scenerio_dataset_rtdetr/annotations/instances_val.json
  test_data_sources: null
  infer_data_sources: null
  quant_calibration_data_sources: null # Need to change as per the dataset used.
  batch_size: 2 # Batch size for training.
  workers: 8 # Number of workers for data loading.
  remap_mscoco_category: false # Remap COCO categories.
  pin_memory: true # Pin memory.
  dataset_type: serialized # Type of dataset.
  num_classes: 3 # Number of classes.
  eval_class_ids: null # IDs of the classes to evaluate.
  augmentation:
    multi_scales: # Multi-scale training.
    - 480
    - 512
    - 544
    - 576
    - 608
    - 640
    - 672
    - 704
    - 736
    - 768
    - 800
    train_spatial_size:
    - 640
    - 640
    eval_spatial_size:
    - 640
    - 640
    distortion_prob: 0.8
    iou_crop_prob: 0.8
    preserve_aspect_ratio: false
train:
  num_gpus: 1
  gpu_ids:
  - 0
  num_nodes: 1
  seed: 1234
  cudnn:
    benchmark: false
    deterministic: true
  num_epochs: 10
  checkpoint_interval: 1
  checkpoint_interval_unit: epoch
  validation_interval: 1
  resume_training_checkpoint_path: null
  results_dir: /workspace/results/train
  freeze: [] # we can freeze the backbone of the model by adding the layer names to this list.
  pretrained_model_path: null
  clip_grad_norm: 0.1
  is_dry_run: false
  enable_ema: false
  ema:
    decay: 0.999
    every_n_steps: 1
    validate_original_weights: false
    cpu_offload: false
  optim:
    optimizer: AdamW
    monitor_name: val_loss
    lr: 0.0001
    lr_backbone: 1.0e-05
    momentum: 0.9
    weight_decay: 0.0001
    lr_scheduler: MultiStep
    lr_steps:
    - 1000
    lr_step_size: 1000
    lr_decay: 0.1
    warmup_steps: 0
  precision: fp32
  distributed_strategy: ddp
  activation_checkpoint: true
evaluate:
  num_gpus: 1
  gpu_ids:
  - 0
  num_nodes: 1
  checkpoint: ???
  trt_engine: null
  results_dir: /workspace/results/evaluate
  batch_size: 1
  input_width: null
  input_height: null
  conf_threshold: 0.0
  is_quantized: false
inference:
  num_gpus: 1
  gpu_ids:
  - 0
  num_nodes: 1
  checkpoint: ???
  trt_engine: null
  results_dir: /workspace/results/inference
  batch_size: 1
  color_map: null
  conf_threshold: 0.5
  is_internal: false
  input_width: null
  input_height: null
  outline_width: 3
  is_quantized: false
export:
  results_dir: /workspace/results/export
  gpu_id: 0
  checkpoint: ???
  onnx_file: ???
  on_cpu: false
  input_channel: 3
  input_width: 640
  input_height: 640
  opset_version: 17
  batch_size: 1
  verbose: false
  format: onnx
  serialize_nvdsinfer: false
  is_quantized: false
gen_trt_engine: 
  results_dir: /workspace/results/trt_engine
  gpu_id: 0
  onnx_file: ???
  trt_engine: ???
  timing_cache: null
  batch_size: 1
  verbose: false
  tensorrt:
    workspace_size: 1024
    min_batch_size: 1
    opt_batch_size: 1
    max_batch_size: 4
    layers_precision: []
    data_type: FP32
    calibration:
      cal_image_dir: ???
      cal_cache_file: ???
      cal_batch_size: 1
      cal_batches: 1
distill: null
quantize:
  backend: torchao
  mode: weight_only_ptq
  algorithm: minmax
  layers: []
  skip_names: []
  model_path: ''
  results_dir: ''
  backend_kwargs: {}
  device: cuda
